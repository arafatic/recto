name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    env:
      LIBGL_ALWAYS_SOFTWARE: "true"
      GALLIUM_DRIVER: "llvmpipe"
      WGPU_BACKEND: "vulkan"
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies and software GPU drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libssl-dev \
            pkg-config \
            libx11-dev \
            libasound2-dev \
            libudev-dev \
            libgl1-mesa-dri \
            mesa-vulkan-drivers \
            libvulkan1 \
            vulkan-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Check
        run: cargo check --workspace

      - name: Cargo Test
        run: cargo test --workspace --no-fail-fast

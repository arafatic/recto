name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    env:
      RECTO_FONTS_REQUIRED: "1"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            artifact: Recto-windows-x64.zip
          - name: linux
            os: ubuntu-latest
            artifact: Recto-linux-x64.tar.gz
          - name: macos
            os: macos-14
            artifact: Recto-macos-arm64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libssl-dev pkg-config libx11-dev libasound2-dev libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --bin recto

      - name: Package Windows installer and archive
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"

          $VERSION = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
            $VERSION = ($metadata.packages | Where-Object { $_.name -eq 'recto' }).version
          }

          ./packaging/windows/test-font-notices.ps1
          . ./packaging/windows/font-notices.ps1
          Copy-RectoFontNotices $PWD.Path (Join-Path $PWD.Path 'target/font-licences')
          iscc "/DMyAppVersion=$VERSION" packaging/windows/setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }

          New-Item -ItemType Directory -Force -Path dist-windows
          Copy-Item target/release/recto.exe dist-windows/
          Copy-Item target/font-licences/*.txt dist-windows/
          7z a -tzip Recto-windows-x64.zip ./dist-windows/*

      - name: Package Linux archive
        if: matrix.os == 'ubuntu-latest'
        run: |
          bash packaging/test-font-notices.sh
          mkdir -p dist-linux/bin
          cp target/release/recto dist-linux/bin/
          chmod +x dist-linux/bin/*
          . packaging/font-notices.sh
          copy_font_licences dist-linux/share/doc/recto
          tar -czvf Recto-linux-x64.tar.gz -C dist-linux .

      - name: Package macOS application bundle
        if: matrix.os == 'macos-14'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="0.14.0"
          fi
          SHORT_VERSION="${VERSION%%-*}"
          
          APP="Recto.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/release/recto" "$APP/Contents/MacOS/recto"
          chmod +x "$APP/Contents/MacOS/recto"
          
          if [ -f "assets/app-icon/recto.icns" ]; then
            cp "assets/app-icon/recto.icns" "$APP/Contents/Resources/recto.icns"
          fi
          
          sed -e "s/@VERSION@/$VERSION/g" \
              -e "s/@SHORT_VERSION@/$SHORT_VERSION/g" \
              -e "s/@BUILD_SHA@/${GITHUB_SHA}/g" \
              "packaging/macos/Info.plist.in" > "$APP/Contents/Info.plist"
              
          printf 'APPL????' > "$APP/Contents/PkgInfo"
          
          for notice in NOTICE LICENSE LICENSE-MIT LICENSE-APACHE; do
            if [ -f "$notice" ]; then
              cp "$notice" "$APP/Contents/Resources/$notice"
            fi
          done
          
          . packaging/font-notices.sh
          copy_font_licences "$APP/Contents/Resources"

          codesign --force --options runtime --entitlements packaging/macos/entitlements.plist --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" "Recto-macos-arm64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-archive
          path: |
            ${{ matrix.artifact }}
            Recto-windows-x64-setup.exe
          if-no-files-found: ignore

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/Recto-windows-x64-setup.exe
            artifacts/Recto-windows-x64.zip
            artifacts/Recto-linux-x64.tar.gz
            artifacts/Recto-macos-arm64.zip
